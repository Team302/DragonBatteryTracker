[alembic]
script_location = alembic
prepend_sys_path = .
# ``env.py`` will override this value with whatever is provided by the
# application settings (which in turn come from ``DATABASE_URL``).  The
# value below is just a harmless fallback for developers running
# ``alembic`` directly on their machine outside of Docker; it does **not**
# control what the containerized entrypoint uses.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/frc_batteries

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
